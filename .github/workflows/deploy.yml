name: Deploy to GitHub Pages

# 每次 push 到 main 就重建 SSG 版並部署到 GitHub Pages。
# 部署用的是「子路徑 base + 絕對網址 SITE_URL」重建的產物，
# 跟 repo 裡提交的根路徑 dist/ 是兩份不同用途的建置（提交的那份給根網域／Cloudflare 用）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 一次只跑一個部署，排隊而不取消進行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置 SSG（子路徑 + 絕對網址）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        env:
          BASE_PATH: /solution-architect-skill/
          SITE_URL: https://designcomb.github.io/solution-architect-skill
        run: npm run build:ssg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
