name: Link check

# 外部連結會被對方擋、會轉址、會逾時，放進每次 PR 會很吵。
# 改成每週定期掃 + 需要時手動觸發：死連結／連不上才算失敗（見 tools/check-links.mjs）。
on:
  schedule:
    - cron: '0 3 * * 1'   # 每週一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 官方連結連連看
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: 掃全 repo 外部連結
        working-directory: web
        run: npm run links
